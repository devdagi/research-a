# Company Device Manager — AWS EC2 public IP 54.175.235.43
# Install:
#   sudo cp deployment/nginx/aws-54.conf /etc/nginx/sites-available/cdm.conf
#   sudo ln -sf /etc/nginx/sites-available/cdm.conf /etc/nginx/sites-enabled/cdm.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 54.175.235.43 _;

    root /var/www/html/testing/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Ubuntu 24.04: php8.3-fpm.sock  |  Ubuntu 22.04: php8.2-fpm.sock
        # bootstrap-ec2.sh rewrites this to the installed version.
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|log|sql|sqlite|bak|swp)$ {
        deny all;
    }
}
