# Company Device Manager — testing site (Nginx)
# Install: copy to /etc/nginx/sites-available/cdm-testing.conf
# Enable:  ln -s /etc/nginx/sites-available/cdm-testing.conf /etc/nginx/sites-enabled/
# Do NOT remove or replace the default site; this is an additional server block.
#
# TLS: uncomment the listen 443 block and certificate paths when ready.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/testing/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|log|sql|sqlite|bak|swp)$ {
        deny all;
    }
}

